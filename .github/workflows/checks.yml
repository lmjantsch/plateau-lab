name: Compatibility checks
on:
  pull_request:
  push:
    branches: [main, integration/lasse-hf]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local and test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt httpx==0.28.1
      - name: Math, hardware, serialization and API contracts
        run: |
          python -m unittest check_trajectory check_hardware check_exports
          python check_math.py
          python check_integration.py
          python check_token_predictions.py
      - name: Legacy and integrated UI contracts
        run: |
          node check_ui.js
          node check_web.js
          node check_token_matrix.js
